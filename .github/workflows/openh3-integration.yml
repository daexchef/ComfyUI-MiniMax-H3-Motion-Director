name: OpenH3 clip integration
on: [push, pull_request]
jobs:
  compiler-to-director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest numpy pillow -r requirements-openh3.txt
      - run: python -m pytest tests/test_openh3_bridge.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/js/tests/minimax_openh3_clips.test.mjs
